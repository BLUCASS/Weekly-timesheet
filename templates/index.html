<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Timesheet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    table {
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      border: 1px solid #cccccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    input {
      padding: 7px;
    }

    input[type="number"] {
      width: 70px;
    }

    button {
      margin-top: 16px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .help-text {
      color: #555;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <h2>Weekly Timesheet</h2>

  <p class="help-text">
    Select the Monday that starts the week, then enter hours and minutes for each day.
  </p>

  <form action="/submit-timesheet" method="post">
    <table>
      <thead>
        <tr>
          <th>Start date</th>
          <th>Day</th>
          <th>Hours worked</th>
          <th>Minutes worked</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td rowspan="7">
            <input
              type="date"
              name="start_date"
              required
            >
          </td>
          <td>Monday</td>
          <td>
            <input
              type="number"
              name="hours_monday"
              min="0"
              max="24"
              step="1"
              value="0"
              required
            >
          </td>
          <td>
            <input
              type="number"
              name="minutes_monday"
              min="0"
              max="59"
              step="1"
              value="0"
              required
            >
          </td>
        </tr>

        <tr>
          <td>Tuesday</td>
          <td><input type="number" name="hours_tuesday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_tuesday" min="0" max="59" step="1" value="0" required></td>
        </tr>

        <tr>
          <td>Wednesday</td>
          <td><input type="number" name="hours_wednesday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_wednesday" min="0" max="59" step="1" value="0" required></td>
        </tr>

        <tr>
          <td>Thursday</td>
          <td><input type="number" name="hours_thursday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_thursday" min="0" max="59" step="1" value="0" required></td>
        </tr>

        <tr>
          <td>Friday</td>
          <td><input type="number" name="hours_friday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_friday" min="0" max="59" step="1" value="0" required></td>
        </tr>

        <tr>
          <td>Saturday</td>
          <td><input type="number" name="hours_saturday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_saturday" min="0" max="59" step="1" value="0" required></td>
        </tr>

        <tr>
          <td>Sunday</td>
          <td><input type="number" name="hours_sunday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_sunday" min="0" max="59" step="1" value="0" required></td>
        </tr>
      </tbody>
    </table>

    <button type="submit">Submit timesheet</button>
  </form>
</body>
</html>
