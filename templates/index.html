<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Timesheet</title>


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 50px 20px;
      background: linear-gradient(135deg, #eef2f7 0%, #dde6f0 100%);
      color: #2b2f38;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      max-width: 700px;
      margin: 0 auto 6px;
      font-size: 26px;
      font-weight: 700;
      color: #1a2233;
    }

    table {
      border-collapse: collapse;
      min-width: 650px;
      max-width: 700px;
      width: 100%;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(30, 41, 59, 0.08);
      margin-bottom: 8px;
    }

    th, td {
      border: none;
      border-bottom: 1px solid #edf1f5;
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      background-color: #1f6feb;
      color: #ffffff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 12px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    tbody tr:hover {
      background-color: #eef4ff;
    }

    input {
      padding: 8px 10px;
      border: 1px solid #d3dbe4;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fbfcfd;
      color: #2b2f38;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
      background-color: #ffffff;
    }

    input[type="number"] {
      width: 70px;
    }

    input[type="date"] {
      width: 150px;
    }

    button {
      margin-top: 16px;
      padding: 12px 26px;
      cursor: pointer;
      background-color: #1f6feb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background-color 0.2s ease, transform 0.15s ease;
      box-shadow: 0 3px 10px rgba(31, 111, 235, 0.25);
    }

    button:hover {
      background-color: #1656b8;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .help-text {
      max-width: 700px;
      color: #5a6472;
      margin-bottom: 22px;
      font-size: 14.5px;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 700px;
    }
  </style>
</head>


<body>
  <h2>Weekly Timesheet</h2>


  <p class="help-text">
    Select the Monday that starts the week, then enter hours and minutes for each day.
  </p>


  <form action="/submit-timesheet" method="post">
    <table>
      <thead>
        <tr>
          <th>Start date</th>
          <th>Day</th>
          <th>Hours worked</th>
          <th>Minutes worked</th>
        </tr>
      </thead>


      <tbody>
        <tr>
          <td rowspan="7">
            <input
              type="date"
              name="start_date"
              required
            >
          </td>
          <td>Monday</td>
          <td>
            <input
              type="number"
              name="hours_monday"
              min="0"
              max="24"
              step="1"
              value="0"
              required
            >
          </td>
          <td>
            <input
              type="number"
              name="minutes_monday"
              min="0"
              max="59"
              step="1"
              value="0"
              required
            >
          </td>
        </tr>


        <tr>
          <td>Tuesday</td>
          <td><input type="number" name="hours_tuesday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_tuesday" min="0" max="59" step="1" value="0" required></td>
        </tr>


        <tr>
          <td>Wednesday</td>
          <td><input type="number" name="hours_wednesday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_wednesday" min="0" max="59" step="1" value="0" required></td>
        </tr>


        <tr>
          <td>Thursday</td>
          <td><input type="number" name="hours_thursday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_thursday" min="0" max="59" step="1" value="0" required></td>
        </tr>


        <tr>
          <td>Friday</td>
          <td><input type="number" name="hours_friday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_friday" min="0" max="59" step="1" value="0" required></td>
        </tr>


        <tr>
          <td>Saturday</td>
          <td><input type="number" name="hours_saturday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_saturday" min="0" max="59" step="1" value="0" required></td>
        </tr>


        <tr>
          <td>Sunday</td>
          <td><input type="number" name="hours_sunday" min="0" max="24" step="1" value="0" required></td>
          <td><input type="number" name="minutes_sunday" min="0" max="59" step="1" value="0" required></td>
        </tr>
      </tbody>
    </table>


    <button type="submit">Submit timesheet</button>
  </form>
</body>
</html>
